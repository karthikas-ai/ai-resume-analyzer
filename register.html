{% extends "base.html" %}
{% block title %}Create Account — ResumeIQ{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card mx-auto">
      <h2 class="mb-1">Create your account</h2>
      <p class="text-muted mb-4">Free forever. Takes less than a minute.</p>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" name="full_name" class="form-control" required autofocus value="{{ full_name or '' }}" placeholder="Karthika R">
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" required value="{{ email or '' }}" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn btn-accent-lg w-100">Create Account</button>
      </form>
      <p class="text-center mt-4 mb-0 small">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
