{% extends "base.html" %}
{% block title %}Login — ResumeIQ{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card mx-auto">
      <h2 class="mb-1">Welcome back</h2>
      <p class="text-muted mb-4">Log in to view your dashboard and analyses.</p>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" required autofocus placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn btn-accent-lg w-100">Log In</button>
      </form>
      <p class="text-center mt-4 mb-0 small">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
  </div>
</section>
{% endblock %}
